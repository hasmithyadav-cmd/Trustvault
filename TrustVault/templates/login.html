{% extends "base.html" %}
{% block title %}Sign in · TrustVault{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <div class="eyebrow">WELCOME BACK</div><h1>Sign in</h1><p class="muted">Access your secure document workspace.</p>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>{{ form.email.label }}{{ form.email(placeholder="you@example.com", autocomplete="email") }}</label>
    <label>{{ form.password.label }}{{ form.password(placeholder="Your password", autocomplete="current-password") }}</label>
    {{ form.submit(class_="button primary full") }}
  </form>
  <p class="auth-foot">New to TrustVault? <a href="{{ url_for('register') }}">Create an account</a></p>
</section></div>
{% endblock %}
